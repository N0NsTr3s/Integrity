<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<script async src="https://cdn.jsdelivr.net/gh/n0nstr3s/Integrity@main/integrity.js"
        data-tenant="demo"
        data-base-path="/Integrity"
        data-manifest-endpoint="https://integrity-backend-yrq3.onrender.com/tenant/demo/manifest"
        data-report-endpoint="https://integrity-backend-yrq3.onrender.com/tenant/demo/report"></script>

<body>
    <form id="paymentForm" action="/process-payment" method="post">
        <h2>Complete Your Payment</h2>
        
        <label for="cardName">Name on Card</label>
        <input type="text" id="cardName" name="cardName" required>
        
        <label for="cardNumber">Card Number</label>
        <input type="text" id="cardNumber" name="cardNumber" placeholder="1111-2222-3333-4444" required>
        
        <label for="expDate">Expiration Date</label>
        <input type="text" id="expDate" name="expDate" placeholder="MM/YY" required>
        
        <label for="cvv">CVV</label>
        <input type="text" id="cvv" name="cvv" placeholder="123" required>
        
        <button type="submit">Pay Now</button>
    </form>
</body>
</html>
